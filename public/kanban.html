function buildChatPanel(tk,msgs){
  const claudeId=tk.claude_session_id||'';
  const openUrl=`/chat?open_session=${encodeURIComponent(tk.session_id)}`;
  const isActive=isTaskActive(tk.status);
  let msgsHtml;
  if(!msgs.length){
    msgsHtml=`<div class="chat-empty">No messages yet${isActive?' — waiting for output...':''}</div>`;
  }else{
    // Group consecutive tool calls into collapsible blocks
    const groups = [];
    let toolGroup = [];
    for(const m of msgs){
      const role=m.role==='user'?'user':m.type==='tool'?'tool':'assistant';
      if(role==='tool'){
        toolGroup.push(m);
      } else {
        if(toolGroup.length){
          groups.push({type:'tools', items:toolGroup});
          toolGroup=[];
        }
        groups.push({type:role, msg:m});
      }
    }
    if(toolGroup.length) groups.push({type:'tools', items:toolGroup});
    
    msgsHtml = groups.map((g,i)=>{
      if(g.type==='tools'){
        const names = [...new Set(g.items.map(t=>t.tool_name||'tool'))];
        const summary = `🔧 ${g.items.length} tool calls: ${names.join(', ')}`;
        const details = g.items.map(t=>`<div class="tool-item"><span class="tool-name">${escH(t.tool_name||'')}</span> <span class="tool-input">${escH((t.content||'').substring(0,150))}</span></div>`).join('');
        return `<details class="chat-tools-group"><summary class="chat-tools-summary">${escH(summary)}</summary><div class="chat-tools-detail">${details}</div></details>`;
      }
      const role=g.type;
      const m=g.msg;
      const label=role==='user'?'YOU':'CLAUDE';
      const text=escH(m.content||'');
      const ts=m.created_at?`<span class="chat-ts">${new Date(m.created_at+'Z').toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>`:'';
      return `<div class="chat-msg"><div class="chat-role ${role}">${label} ${ts}</div><div class="chat-text">${text}</div></div>`;
    }).join('');
  }
  const copyBtn=claudeId?`<span class="mono-tag" title="${t('chat.copy_id')}" onclick="navigator.clipboard.writeText('${escH(claudeId)}').then(()=>toast(t('toast.copied')))">${claudeId.slice(0,12)}…</span>`:'';
  const openBtn=`<a class="open-link" href="${openUrl}" target="_blank">${t('chat.open')}</a>`;
  const liveBadge=isActive?`<span class="live-badge"><span class="spinning" style="width:10px;height:10px;border-width:1.5px"></span> Live</span>`:'';
  return `<div class="chat-panel">
    <div class="chat-panel-hd">
      <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
        <span style="font-size:12px;font-weight:600;color:var(--fg)">${liveBadge} ${escH((tk.sess_title||'Session').substring(0,40))}</span>
        <div style="display:flex;gap:6px;align-items:center">${copyBtn}${openBtn}</div>
      </div>
    </div>
    <div class="chat-panel-body" id="chatPanelBody">${msgsHtml}</div>
    ${tk.status==='awaiting_input'||isActive?`<div class="chat-reply-bar">
      <input type="text" id="chatReplyInput" class="chat-reply-input" placeholder="Reply to continue…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatReply('${escH(tk.id)}','${escH(tk.session_id)}')}" />
      <button class="chat-reply-btn" onclick="sendChatReply('${escH(tk.id)}','${escH(tk.session_id)}')">Send ▶</button>
    </div>`:''}
  </div>`;
}

// ─── Save task ────────────────────────────────────────────────────────────
async function sendChatReply(taskId, sessionId) {
  const input = $i('chatReplyInput');
  const text = input?.value?.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;
  try {
    const r = await apiFetch('/api/tasks/' + taskId + '/reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const d = await r.json();
    if (d.error) { toast(d.error); input.disabled = false; return; }
    toast('Reply sent — task resuming');
    // Refresh to show updated status
    setTimeout(() => refresh(true), 1000);
  } catch (e) {
    toast('Failed to send reply');
  }
  input.disabled = false;
}

async function saveTask(){
  const title=($i('fTitle')?.value||'').trim();
  if(!title){toast(t('modal.name'),true);$i('fTitle')?.focus();return;}
  let session_id=$i('fSession')?.value||null;
  const cfg=getSessCfg();
  const existingTask=editingId?tasks.find(t=>t.id===editingId):null;
  // Handle BMAD workflow selection
  const wfType=$i('fWorkflow')?.value||'';
  let rawNotes=$i('fNotes')?($i('fNotes').value||''):(existingTask?.notes||'');
  // Preserve existing bmad sprint tags from original notes
  const origNotes=existingTask?.notes||'';
  const sprintTags=(origNotes.match(/\[bmad:[^\]]+\]/g)||[]).join(' ');
  const phaseTags=(origNotes.match(/\[bmad-phase:\w+\]/g)||[]).join(' ');
  // Remove any existing workflow tag before re-tagging
  rawNotes=rawNotes.replace(/\[bmad-workflow:[\w-]+\]/g,'').replace(/\[bmad:[^\]]+\]/g,'').replace(/\[bmad-phase:\w+\]/g,'').trim();
  if(wfType) rawNotes=(rawNotes?rawNotes+'\n':'')+`[bmad-workflow:${wfType}]`;
  if(sprintTags) rawNotes=(rawNotes?rawNotes+' ':'')+sprintTags;
  if(phaseTags) rawNotes=(rawNotes?rawNotes+' ':'')+phaseTags;
  const resolvedStatus = modalMode==='add' && wfType ? 'bmad_workflow' : ($i('fStatus')?.value||'backlog');
  const body={
    title,
    description:$i('fDesc')?($i('fDesc').value||''):(existingTask?.description||''),
    notes:rawNotes,
    status:resolvedStatus,
    session_id,
    workdir:curWorkdir||null,
    model:cfg.model,
    mode:cfg.mode,
    agent_mode:cfg.agent,
    max_turns:cfg.maxTurns,
    attachments:pendingAttachments.length?JSON.stringify(pendingAttachments):null,
  };
  try{
    if(modalMode==='add'){
      if(!session_id){
        const sessR=await apiFetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({title,workdir:curWorkdir||null,model:cfg.model,engine:cfg.engine,mode:cfg.mode,agentMode:cfg.agent,maxTurns:cfg.maxTurns})});
        const sess=await sessR.json();
        session_id=sess.id;
        body.session_id=session_id;
        toast(t('toast.sess_created'));
      }
      const afterId=$i('fAfter')?.value||'';
      if(afterId) body.after=afterId;
      const colTasks=tasks.filter(tk=>tk.status===body.status);
      body.sort_order=colTasks.length?Math.max(...colTasks.map(tk=>tk.sort_order))+1000:0;
      await apiFetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      toast(afterId?'✅ Created & chained':t('toast.created'));
    }else{
      const orig=tasks.find(tk=>tk.id===editingId);
      if(orig)body.sort_order=orig.sort_order;
      await apiFetch(`/api/tasks/${editingId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      try{const bc=new BroadcastChannel('tasks');bc.postMessage({type:'task_changed',id:editingId});bc.close();}catch{}
      toast(t('toast.saved'));
    }
    closeModal();
    await refresh(true);
  }catch(e){if(e.message!=='401')toast(t('toast.err')+e.message,true);}
}

// Restart / Cancel / Move actions
async function confirmRestart(id) {
  const tk = tasks.find(x => x.id === id);
  if (!tk) return;
  const active = ['bmad_implementation', 'bmad_qa', 'in_progress', 'bmad_brainstorm', 'bmad_prd', 'bmad_architecture'].includes(tk.status);
  const msg = active
    ? `Restart «${tk.title}»?\n\nThis will KILL the running worker and re-queue the task with current BMAD settings.`
    : `Restart «${tk.title}»?\n\nThis re-queues it with current BMAD settings.`;
  if (!confirm(msg)) return;
  try {
    const r = await apiFetch(`/api/tasks/${id}/restart`, { method: 'POST' });
    const d = await r.json();
    if (!d.ok) { toast('Restart failed: ' + (d.error || 'unknown'), true); return; }
    toast(d.killed ? '↻ Killed worker and re-queued' : '↻ Re-queued');
    await refresh(true);
  } catch (e) {
    if (e.message !== '401') toast('Error: ' + e.message, true);
  }
}

  pop.innerHTML = TARGETS.map(t => `

         onmouseover="this.style.background='var(--s2)'" onmouseout="this.style.background=''">
      ${t.label}
    </div>`).join('');
  const rect = evt.target.getBoundingClientRect();
  pop.style.left = Math.min(rect.left, window.innerWidth - 200) + 'px';
  pop.style.top = (rect.bottom + 4) + 'px';
  document.body.appendChild(pop);
  pop.addEventListener('click', async (e) => {
    const opt = e.target.closest('.move-opt');
    if (!opt) return;
    const targetCol = opt.dataset.col;
    pop.remove();
    try {
      const r = await apiFetch(`/api/tasks/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: targetCol })
      });
      if (!r.ok) { toast('Move failed', true); return; }
      toast(`→ Moved to ${opt.textContent.trim()}`);
      await refresh(true);
    } catch (ex) {
      if (ex.message !== '401') toast('Error: ' + ex.message, true);
    }
  });
  setTimeout(() => {
    const closer = (ev) => {
      if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('click', closer); }
    };
    document.addEventListener('click', closer);
  }, 0);

async function saveProjectSettings() {
  const ids = window._projSettingsIds || [];
  let saved = 0, errors = [];
  for (const id of ids) {
    const input = $i('proj_mw_' + id);
    if (!input) continue;
    const mw = parseInt(input.value, 10);
    if (isNaN(mw) || mw < 1 || mw > 20) { errors.push(id); continue; }
    try {
      const r = await apiFetch(`/api/projects/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ maxWorkers: mw })
      });
      if (r.ok) saved++;
    } catch { errors.push(id); }
  }
  if (errors.length) toast(`Saved ${saved}, ${errors.length} failed`, true);
  else toast(`✓ Saved ${saved} project setting${saved === 1 ? '' : 's'}`);
  if (!errors.length) $i('projCfgOv').classList.add('hidden');
}

// ─── Swipe-left to close sidebar ─────────────────────────────────────────────
(function initSidebarSwipe() {
  let _swipeStartX = null, _swipeStartY = null;
  const SWIPE_THRESHOLD = 50; // px leftward swipe to dismiss
  const SWIPE_MAX_Y = 80;     // max vertical drift to count as horizontal swipe

  document.addEventListener('touchstart', function(e) {
    const sidebar = $i('kbSidebar');
    if (!sidebar || sidebar.classList.contains('collapsed')) return;
    const touch = e.touches[0];
    _swipeStartX = touch.clientX;
    _swipeStartY = touch.clientY;
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (_swipeStartX === null) return;
    const sidebar = $i('kbSidebar');
    if (!sidebar || sidebar.classList.contains('collapsed')) { _swipeStartX = null; return; }
    const touch = e.changedTouches[0];
    const dx = touch.clientX - _swipeStartX;
    const dy = Math.abs(touch.clientY - _swipeStartY);
    _swipeStartX = null;
    _swipeStartY = null;
    // Swipe left (negative dx) by threshold, with limited vertical drift
    if (dx < -SWIPE_THRESHOLD && dy < SWIPE_MAX_Y) {
      if (_kbSidebarOpen) toggleKbSidebar();
    }
  }, { passive: true });
})();

function renderDocsSidebar(docs) {
  const sidebar = $i('docsSidebar');
  if (!docs.length) {
    sidebar.innerHTML = '<div class="docs-empty" style="padding:20px;font-size:12px">No documents yet.<br>Run a workflow to generate them.</div>';
    return;
  }

  // Build folder tree from relativePath
  // Group: top-level folder → subfolder → files
  const tree = {};
  for (const f of docs) {
    const parts = f.relativePath.split('/');
    let topFolder, subFolder, fileName;
    if (parts.length === 1) {
      topFolder = 'Root'; subFolder = null; fileName = parts[0];
    } else if (parts.length === 2) {
      topFolder = parts[0]; subFolder = null; fileName = parts[1];
    } else {
      topFolder = parts[0]; subFolder = parts.slice(1, -1).join('/'); fileName = parts[parts.length - 1];
    }
    if (!tree[topFolder]) tree[topFolder] = { files: [], subs: {} };
    if (subFolder) {
      if (!tree[topFolder].subs[subFolder]) tree[topFolder].subs[subFolder] = [];
      tree[topFolder].subs[subFolder].push(f);
    } else {
      tree[topFolder].files.push(f);
    }
  }

  const FOLDER_ICONS = {
    '_bmad-output': '🔮', 'docs': '📚', 'tests': '🧪', 'test-screenshots': '📸', 'test-results': '📋', 'Root': '📁'
  };
  const FOLDER_LABELS = {
    '_bmad-output': 'BMAD Output', 'docs': 'Project Docs', 'tests': 'Tests', 'test-screenshots': 'Screenshots', 'test-results': 'Test Results'
  };

  function fileIcon(name) {
    if (/\.(yaml|yml)$/i.test(name)) return '📊';
    if (/\.(png|jpg|jpeg|gif|svg|webp|bmp)$/i.test(name)) return '🖼️';
    if (/\.(pdf|doc|docx|xls|xlsx)$/i.test(name)) return '📄';
    if (/\.(json)$/i.test(name)) return '{}';
    if (/\.(csv)$/i.test(name)) return '📈';
    return '📝';
  }

  function fileRow(f) {
    const size = f.size < 1024 ? f.size + 'B' : f.size < 1048576 ? Math.round(f.size / 1024) + 'KB' : (f.size / 1048576).toFixed(1) + 'MB';
    const isShared = _docsShares.some(s => s.file_path === f.path);
    const shareIndicator = isShared ? ' <span class="doc-share-indicator" title="Shared">🔗</span>' : '';
    return `<div class="docs-file" onclick="loadDoc('${escH(f.path)}',this)" title="${escH(f.relativePath)}" data-filepath="${escH(f.path)}">
      <span class="docs-file-icon">${fileIcon(f.name)}</span>
      <div class="docs-file-info">
        <div class="docs-file-name">${escH(f.name)}${shareIndicator}</div>
        <div class="docs-file-meta">${size}</div>
      </div>
      <button class="docs-share-btn" onclick="event.stopPropagation();openShareModal('${escH(f.path)}')" title="Share document">🔗</button>
    </div>`;
  }

  let html = '<input class="docs-search" id="docsSearchInput" type="text" placeholder="🔍 Search documents..." oninput="filterDocs(this.value)">';

  // Sort top folders: BMAD Output first, then docs, then screenshots, then rest
  const folderOrder = ['_bmad-output', 'docs', 'test-screenshots', 'tests', 'test-results'];
  const sortedFolders = Object.keys(tree).sort((a, b) => {
    const ai = folderOrder.indexOf(a), bi = folderOrder.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });

  for (const folder of sortedFolders) {
    const node = tree[folder];
    const totalFiles = node.files.length + Object.values(node.subs).reduce((s, arr) => s + arr.length, 0);
    const icon = FOLDER_ICONS[folder] || '📁';
    const label = FOLDER_LABELS[folder] || folder;
    const folderId = 'df_' + folder.replace(/[^a-z0-9]/gi, '_');

    html += `<div class="docs-cat" onclick="this.classList.toggle('collapsed')" id="${folderId}">
      <span class="chevron">▼</span>${icon} ${escH(label)} <span style="font-weight:400;font-size:9px;color:var(--muted)">(${totalFiles})</span>
    </div>`;
    html += `<div class="docs-folder-contents" data-folder="${escH(folderId)}">`;

    // Subfolders first
    const subKeys = Object.keys(node.subs).sort();
    for (const sub of subKeys) {
      const subFiles = node.subs[sub];
      const subId = folderId + '_' + sub.replace(/[^a-z0-9]/gi, '_');
      const subIcon = sub.includes('planning') ? '📋' : sub.includes('implementation') ? '⚙️' : sub.includes('analysis') ? '🔬' : '📂';
      html += `<div class="docs-subfolder">
        <div class="docs-subfolder-label" onclick="this.classList.toggle('collapsed')" id="${subId}">
          <span class="chevron">▼</span>${subIcon} ${escH(sub)}<span class="docs-subfolder-count">${subFiles.length}</span>
        </div>
        <div class="docs-subfolder-files" data-sub="${escH(subId)}">`;
      for (const f of subFiles.sort((a, b) => a.name.localeCompare(b.name))) {
        html += fileRow(f);
      }
      html += `</div></div>`;
    }

    // Direct files
    for (const f of node.files.sort((a, b) => a.name.localeCompare(b.name))) {
      html += fileRow(f);
    }

    html += `</div>`;
  }

  sidebar.innerHTML = html;
}

  document.querySelectorAll('.docs-file').forEach(el => {
    const name = (el.querySelector('.docs-file-name')?.textContent || '').toLowerCase();
    const path = (el.getAttribute('title') || '').toLowerCase();
    el.style.display = (!q || name.includes(q) || path.includes(q)) ? '' : 'none';

    document.querySelectorAll('.docs-cat.collapsed, .docs-subfolder-label.collapsed').forEach(el => el.classList.remove('collapsed'));

async function createShare(filePath) {

    const r = await apiFetch('/api/docs/share', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ projectId: curWorkdir, filePath, expiresIn: expiresIn ? parseInt(expiresIn) : null }) });

function copyShareUrl() {
  const inp = $i('shareUrlInput');
  if (!inp) return;
  const url = inp.value;
  // Try modern clipboard API first (requires HTTPS)
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(() => toast('URL copied!')).catch(() => fallbackCopy(url));
  } else {
    fallbackCopy(url);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); toast('URL copied!'); } catch (e) { toast('Copy failed — select URL manually', true); }
  document.body.removeChild(ta);
}

function renderMarkdown(md) {
  // Lightweight markdown renderer
  let html = escH(md);
  // Code blocks (``` ... ```)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`);
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');
  // Unordered lists
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // Ordered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Tables (simple: | col | col |)
  html = html.replace(/^(\|.+\|)\n(\|[-: |]+\|)\n((?:\|.+\|\n?)*)/gm, (_, header, sep, body) => {
    const ths = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
    const rows = body.trim().split('\n').map(row => {
      const tds = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
  });
  // Paragraphs (double newline)
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  // Single newlines to <br> (within paragraphs)
  html = html.replace(/([^>])\n([^<])/g, '$1<br>$2');
  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');
  return html;
}

async function handleDocUpload(input) {
  if (!input.files.length || !curWorkdir) return;
  const formData = new FormData();
  formData.append('workdir', curWorkdir);
  formData.append('folder', _uploadTargetFolder);
  for (const file of input.files) {
    formData.append('files', file);
  }
  try {
    const r = await fetch('/api/bmad/upload', { method: 'POST', body: formData });
    const d = await r.json();
    if (d.error) { toast('Upload failed: ' + d.error, true); return; }
    toast(`Uploaded ${d.count} file(s) to ${_uploadTargetFolder}/`);
    loadDocsList(); // refresh sidebar
  } catch(e) { toast('Upload failed: ' + e.message, true); }
  input.value = ''; // reset file input

  const preview = $i('docEditorPreview');
  if (preview) {
    preview.innerHTML = text.trim() ? `<div class="md-rendered">${renderMarkdown(text)}</div>` : '<div class="docs-empty">Preview will appear here</div>';
  }
}

function insertAtCursor(before, after='') {
  const ta = $i('docEditorText');
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const selected = ta.value.substring(start, end);
  ta.value = ta.value.substring(0, start) + before + selected + after + ta.value.substring(end);
  ta.selectionStart = start + before.length;
  ta.selectionEnd = start + before.length + selected.length;
  ta.focus();
  updateDocPreview();
}

function insertMdHeading() { insertAtCursor('## '); }
function insertMdBold() { insertAtCursor('**', '**'); }
function insertMdList() { insertAtCursor('- '); }
function insertMdCode() { insertAtCursor('```\n', '\n```'); }
function insertMdTable() { insertAtCursor('| Column 1 | Column 2 | Column 3 |\n|----------|----------|----------|\n| | | |\n'); }

function cancelEditor() {
  if (_editingDocPath) {
    // Reload the document in view mode
    loadDoc(_editingDocPath, null);
  } else {
    $i('docsContent').innerHTML = '<div class="docs-empty">Select a document to preview</div>';
  }
}

async function saveDocument() {
  const text = $i('docEditorText')?.value || '';
  let filePath;
  
  if (_editingDocPath) {
    filePath = _editingDocPath;
  } else {
    // New document
    const folder = $i('docEditorFolder')?.value || 'docs';
    const title = $i('docEditorTitle')?.value?.trim();
    if (!title) { toast('Filename required'); return; }
    const filename = title.endsWith('.md') ? title : title + '.md';
    filePath = `${curWorkdir}/${folder}/${filename}`;
  }
  
  try {
    const r = await apiFetch('/api/bmad/doc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filePath, content: text })
    });
    const d = await r.json();
    if (d.error) { toast(d.error); return; }
    toast('Document saved');
    _editingDocPath = filePath;
    // Refresh sidebar
    loadDocsList();
    // Show the saved doc in view mode
    setTimeout(() => loadDoc(filePath, null), 300);
  } catch (e) {
    toast('Save failed: ' + e.message);
  }
}

async function deleteDocument(filePath) {
  if (!confirm(`Delete ${filePath.split('/').pop()}?`)) return;
  try {
    const r = await apiFetch(`/api/bmad/doc?path=${encodeURIComponent(filePath)}`, { method: 'DELETE' });
    const d = await r.json();
    if (d.error) { toast(d.error); return; }
    toast('Document deleted');
    _editingDocPath = null;
    $i('docsContent').innerHTML = '<div class="docs-empty">Select a document to preview</div>';
    loadDocsList();
  } catch (e) { toast('Delete failed'); }
}

async function checkBmadDocs() {
  if (!curWorkdir) { $i('bmadDocsBtn').style.display = 'none'; return; }
  try {
    const r = await apiFetch(`/api/bmad/docs?workdir=${encodeURIComponent(curWorkdir)}`);
    const d = await r.json();
    $i('bmadDocsBtn').style.display = (d.docs.length || d.hasBmad) ? '' : 'none';
  } catch { $i('bmadDocsBtn').style.display = 'none'; }
}
async function checkSprintStatus() {
  if (!curWorkdir) { $i('sprintSyncBtn').style.display='none'; $i('autoModeBtn').style.display='none'; return; }
  try {
    const r = await apiFetch(`/api/bmad/sprint-status?workdir=${encodeURIComponent(curWorkdir)}`);
    const d = await r.json();
    $i('sprintSyncBtn').style.display = d.found ? '' : 'none';
    window._sprintData = d.found ? d : null;
  } catch { $i('sprintSyncBtn').style.display='none'; }
  // Update auto mode button state
  updateAutoModeBtn();
}

function updateAutoModeBtn() {
  const btn = $i('autoModeBtn');
  if (!curWorkdir || !projects.length) { btn.style.display='none'; return; }
  const proj = projects.find(p => p.workdir === curWorkdir);
  if (!proj) { btn.style.display='none'; return; }
  btn.style.display = '';
  if (proj.autoMode) {
    btn.style.background = '#ef4444';
    btn.style.color = '#fff';
    btn.textContent = '⏸️ Stop Auto';
    btn.title = 'Auto Mode is ON — processing tasks automatically. Click to stop.';
  } else {
    btn.style.background = 'var(--s2)';
    btn.style.color = 'var(--fg)';
    btn.style.border = '1px solid var(--border)';
    btn.textContent = '🤖 Auto Mode';
    btn.title = 'Enable Auto Mode: automatically process all backlog tasks, 5 at a time';
  }
}

async function toggleAutoMode() {
  const proj = projects.find(p => p.workdir === curWorkdir);
  if (!proj) return;
  const newState = !proj.autoMode;
  if (newState) {
    const backlogCount = tasks.filter(t => t.status === 'backlog').length;
    if (!confirm(`Enable Auto Mode for "${proj.name}"?\n\n${backlogCount} backlog tasks will be automatically processed, 5 at a time, until all are done.\n\nEach task goes through the full BMAD pipeline (Analyst → Elicitation → Architect → Elicitation → Developer → Code Review → QA).\n\nContinue?`)) return;
  }
  try {
    await apiFetch(`/api/projects/${proj.id}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ autoMode: newState })
    });
    proj.autoMode = newState;
    updateAutoModeBtn();
    toast(newState ? '🤖 Auto Mode enabled' : '⏸️ Auto Mode disabled');
    if (newState) setTimeout(() => refresh(true), 2000); // refresh to see moved tasks
  } catch (e) {
    toast('Error: ' + e.message, true);
  }
}

// Check sprint status when project changes
const _origRefresh = refresh;
refresh = async function(force) {
  await _origRefresh(force);
  checkSprintStatus();
  checkBmadDocs();
};

function showSprintSync() {
  const d = window._sprintData;
  if (!d) return toast('No sprint data found', true);

  // Build modal content
  let html = `<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center" id="sprintOv" onclick="if(event.target===this)this.remove()">
  <div style="background:var(--s1);border:1px solid var(--border);border-radius:12px;width:95%;max-width:750px;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow-xl)">
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <div>
        <strong style="font-size:15px">⚡ Sprint Sync — ${escH(d.meta.project)}</strong>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Generated: ${escH(String(d.meta.generated))} · ${d.epics.length} epics</div>
      </div>
      <div style="display:flex;gap:8px">
        <select id="sprintFilter" style="background:var(--s2);border:1px solid var(--border);color:var(--fg);padding:3px 8px;border-radius:6px;font-size:12px">
          <option value="all">All stories</option>
          <option value="active" selected>Active only</option>
          <option value="backlog">Backlog only</option>
        </select>
        <button onclick="doSprintSync()" style="background:var(--accent2);color:#fff;border:none;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">Sync to Kanban</button>
        <button onclick="$i('sprintOv').remove()" style="background:var(--s2);color:var(--fg);border:1px solid var(--border);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:16px">✕</button>
      </div>
    </div>
    <div style="padding:14px 18px;overflow-y:auto;flex:1">`;

  const statusColors = {
    'backlog':'var(--muted)','ready-for-dev':'var(--blue)','in-progress':'var(--orange)',
    'review':'#e8a838','needs-revision':'var(--red)','done':'var(--green)','optional':'var(--muted)'
  };

  for (const epic of d.epics) {
    const epicColor = statusColors[epic.status] || 'var(--muted)';
    const doneCount = epic.stories.filter(s=>s.status==='done').length;
    html += `<div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${epicColor}"></span>
        <strong style="font-size:13px">${escH(epic.id)}: ${escH(epic.title)}</strong>
        <span style="font-size:11px;color:var(--muted)">${epic.status} · ${doneCount}/${epic.stories.length} stories done</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;padding-left:16px">`;

    for (const story of epic.stories) {
      const sc = statusColors[story.status] || 'var(--muted)';
      const notesSnip = story.notes ? ` — <span style="color:var(--muted)">${escH(story.notes.substring(0,80))}${story.notes.length>80?'…':''}</span>` : '';
      html += `<div style="display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0">
        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${sc};flex-shrink:0"></span>
        <span style="color:var(--fg)">${escH(story.id)}</span>
        <span style="padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;background:${sc}20;color:${sc}">${story.status}</span>
        <span style="flex:1;color:var(--fg2)">${escH(story.title)}${notesSnip}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  html += `<div id="sprintSyncResult" style="margin-top:12px"></div>`;
  html += `</div></div></div>`;

  document.body.insertAdjacentHTML('beforeend', html);
}

async function doSprintSync() {
  const filter = $i('sprintFilter')?.value || 'active';
  const resultEl = $i('sprintSyncResult');
  resultEl.innerHTML = '<span style="color:var(--accent2)">Syncing…</span>';
  try {
    const r = await apiFetch('/api/bmad/sprint-sync', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ workdir: curWorkdir, filter })
    });
    const d = await r.json();
    if (d.error) { resultEl.innerHTML = `<span style="color:var(--red)">Error: ${escH(d.error)}</span>`; return; }
    resultEl.innerHTML = `<div style="padding:8px 12px;background:var(--s2);border-radius:8px;font-size:12px">
      <strong style="color:var(--green)">✓ Synced!</strong>
      <span style="color:var(--fg2)">Created: ${d.created} · Updated: ${d.updated} · Skipped: ${d.skipped}</span>
    </div>`;
    refresh(true);
  } catch(e) {
    resultEl.innerHTML = `<span style="color:var(--red)">Error: ${escH(e.message)}</span>`;
  }
}
</script>
